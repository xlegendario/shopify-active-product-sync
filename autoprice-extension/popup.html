<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:13px system-ui;width:300px;padding:12px}
label{display:block;margin:8px 0 2px;color:#555}
input{width:100%;box-sizing:border-box;padding:6px}
button{margin-top:10px;padding:8px;width:100%}
#status{margin-top:10px;white-space:pre-wrap;color:#333}
</style></head><body>
<b>Autopricing - StockX Pro</b>
<label>Server</label><input id="server" placeholder="https://shopify-active-product-sync.onrender.com">
<label>Secret (AUTOPRICE_SECRET)</label><input id="secret" type="password">
<label>StockX e-mail (optional, for re-login)</label><input id="email">
<label>StockX password (optional)</label><input id="password" type="password">
<button id="save">Save</button>
<button id="toggle">Start</button>
<div id="status"></div>
<script src="popup.js" type="module"></script>
</body></html>
